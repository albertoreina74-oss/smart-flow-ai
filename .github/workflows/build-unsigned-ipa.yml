name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  # Gates the build: typecheck + unit tests take well under a minute on Linux,
  # so a mistake surfaces there instead of after an eight-minute macOS archive.
  # Deliberately a separate job — the build runs on Node 20, while running the
  # TypeScript test files directly needs a newer Node.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck and run tests
        run: npm run check

  build:
    needs: check
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install JS dependencies
        run: npm ci

      - name: Write .env and export job-wide env var
        env:
          GEMINI_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
        run: |
          echo "EXPO_PUBLIC_GEMINI_API_KEY=$GEMINI_KEY" > .env
          echo "EXPO_PUBLIC_GEMINI_API_KEY=$GEMINI_KEY" >> "$GITHUB_ENV"
          echo "Gemini key length: ${#GEMINI_KEY}"

      - name: Prebuild iOS native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build unsigned archive
        working-directory: ios
        run: |
          xcodebuild \
            -workspace smartflowai.xcworkspace \
            -scheme smartflowai \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/smartflowai.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r "ios/build/smartflowai.xcarchive/Products/Applications/smartflowai.app" Payload/
          zip -r smartflowai-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartflowai-unsigned-ipa
          path: smartflowai-unsigned.ipa
          retention-days: 14
